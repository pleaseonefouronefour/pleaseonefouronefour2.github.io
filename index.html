<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="main.css" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet"/>
    <title>enter zee site</title>
</head>
<body>
    <div id="enter" style="font-family: 'Bebas Neue', cursive;">⸸⸸⸸</div>
    <div class="kkk">press</div>
    <script>
        var enterText = document.getElementById('enter');
        var baseWord = '⛧⛧⛧';
        var currentIndex = 0;
        var isDeleting = false;

        function gotoMain() {
            window.location.href = 'main.html';
        }

        function animateText() {
            if (isDeleting) {
                currentIndex--;
                enterText.textContent = baseWord.slice(0, currentIndex);
                if (currentIndex <= 0) {
                    isDeleting = false;
                    setTimeout(animateText, 300);
                    return;
                }
                setTimeout(animateText, 70);
            } else {
                currentIndex++;
                enterText.textContent = baseWord.slice(0, currentIndex);
                if (currentIndex >= baseWord.length) {
                    isDeleting = true;
                    setTimeout(animateText, 850);
                    return;
                }
                setTimeout(animateText, 140);
            }
        }

        enterText.addEventListener('click', gotoMain);

        window.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                gotoMain();
            }
        });

        window.addEventListener('load', function () {
            animateText();
        });
    </script>
</body>
</html>
